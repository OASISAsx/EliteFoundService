name: Backend CI/CD

on:
  push:
    branches:
      - dev

jobs:
  merge-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge dev into build
        run: |
          git checkout build || git checkout -b build
          git merge dev
          git push origin build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build backend
        run: npm run build

      - name: Show current path (debug once)
        run: pwd

      - name: Restart backend service
        run: |
          pm2 restart backend || pm2 start dist/index.js --name backend
