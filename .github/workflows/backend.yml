name: Backend CI/CD

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build backend
        run: npm run build

      - name: Restart backend
        run: |
          pm2 restart elite-backend || pm2 start dist/index.js --name elite-backend
