name: Backend CI/CD (build branch)

on:
  push:
    branches:
      - build

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build backend
        run: npm run build

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Restart backend service
        run: |
          pm2 restart backend || pm2 start dist/main.js --name backend
