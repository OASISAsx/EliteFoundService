name: Backend Auto Deploy

on:
  push:
    branches:
      - dev

jobs:
  deploy-backend:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Merge dev into build
        run: |
          git checkout build || git checkout -b build
          git merge dev
          git push origin build

      - name: Build backend
        run: |
          cd ~/EliteFoundService
          git pull origin build
          npm install
          npm run build

      - name: Restart backend
        run: |
          pm2 restart elite-backend || pm2 start dist/index.js --name elite-backend
