name: Backend CI/CD

on:
  push:
    branches:
      - build

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Restart backend
        run: |
          pm2 restart elite-backend || pm2 start dist/index.js --name elite-backend
