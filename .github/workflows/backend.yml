name: Backend CI/CD

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm install

      - name: Build
        run: npm run build

      - name: Restart backend
        run: |
          pm2 restart elite-backend || pm2 start dist/index.js --name elite-backend
